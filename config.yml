attrs:
  perform_lexical_analysis_event:
    module_path: src.events.lexer
    class_name: PerformLexicalAnalysis
  perform_syntactic_analysis_event:
    module_path: src.events.parser
    class_name: PerformSyntacticAnalysis
  emit_scan_result_event:
    module_path: src.events.lexer
    class_name: EmitScanResult
  emit_parse_result_event:
    module_path: src.events.parser
    class_name: EmitParseResult
  lexer_service:
    module_path: src.utils.lexer
    class_name: TiferetLexer
  parser_service:
    module_path: src.utils.parser
    class_name: TiferetParser
  perform_semantic_analysis_event:
    module_path: src.events.semantic
    class_name: PerformSemanticAnalysis
  emit_semantic_result_event:
    module_path: src.events.semantic
    class_name: EmitSemanticResult
  generate_ir_event:
    module_path: src.events.ir
    class_name: GenerateIR
  emit_ir_result_event:
    module_path: src.events.ir
    class_name: EmitIRResult
  ir_service:
    module_path: src.utils.ir
    class_name: IRGenerator

features:
  scan:
    event:
      name: 'Scan Event'
      description: 'Perform lexical scanning on a Tiferet event source file'
      commands:
        - attribute_id: perform_lexical_analysis_event
          name: Tokenize and compute lexical metrics
          data_key: tokens
        - attribute_id: emit_scan_result_event
          name: Assemble and emit scan result
  parse:
    event:
      name: 'Parse Event'
      description: 'Perform syntactic parsing on a Tiferet event source file'
      commands:
        - attribute_id: perform_lexical_analysis_event
          name: Tokenize and compute lexical metrics
          data_key: tokens
        - attribute_id: perform_syntactic_analysis_event
          name: Parse token stream into AST
          data_key: ast
        - attribute_id: emit_parse_result_event
          name: Assemble and emit parse result
  semantic:
    event:
      name: 'Semantic Event'
      description: 'Perform semantic analysis on a Tiferet event source file'
      commands:
        - attribute_id: perform_lexical_analysis_event
          name: Tokenize and compute lexical metrics
          data_key: tokens
        - attribute_id: perform_syntactic_analysis_event
          name: Parse token stream into AST
          data_key: ast
        - attribute_id: perform_semantic_analysis_event
          name: Build symbol table and resolve names
          data_key: semantic
        - attribute_id: emit_semantic_result_event
          name: Assemble and emit semantic analysis result
  ir:
    event:
      name: 'IR Event'
      description: 'Generate a keter IR from a Tiferet event source file'
      commands:
        - attribute_id: perform_lexical_analysis_event
          name: Tokenize and compute lexical metrics
          data_key: tokens
        - attribute_id: perform_syntactic_analysis_event
          name: Parse token stream into AST
          data_key: ast
        - attribute_id: perform_semantic_analysis_event
          name: Build symbol table and resolve names
          data_key: semantic
        - attribute_id: generate_ir_event
          name: Generate keter IR from AST and symbol table
          params:
            ir_service: ir_service
          data_key: ir
        - attribute_id: emit_ir_result_event
          name: Serialize and emit keter IR

errors:
  TEXT_EXTRACTION_FAILED:
    name: Text Extraction Failed
    message:
      - lang: en_US
        text: 'Failed to extract text blocks from source file: {source_file}'
  LEXICAL_ERROR_DETECTED:
    name: Lexical Error Detected
    message:
      - lang: en_US
        text: 'Lexical error detected during tokenization'
  PARSER_NOT_INITIALIZED:
    name: Parser Not Initialized
    message:
      - lang: en_US
        text: 'TiferetParser service failed to initialize'
  INVALID_AST_STRUCTURE:
    name: Invalid AST Structure
    message:
      - lang: en_US
        text: 'Syntactic parser did not return a valid Module AST'
  MISSING_AST:
    name: Missing AST
    message:
      - lang: en_US
        text: 'No AST received from syntactic analysis'

logging: {}

cli:
  cmds:
    scan:
      event:
        group_key: scan
        key: event
        name: Scan Event Command
        description: Perform lexical scanning on a Tiferet event source file.
        args:
          - name_or_flags:
              - source_file
            description: Path to the Python source file to scan.
          - name_or_flags:
              - -o
              - --output
            description: Path to output YAML/JSON file.
          - name_or_flags:
              - --output-format
            description: "Output format: yaml, json, console, or auto."
          - name_or_flags:
              - --summary-only
            description: Output only metrics/summary (no token list).

    parse:
      event:
        group_key: parse
        key: event
        name: Parse Event Command
        description: Perform syntactic parsing on a Tiferet event source file.
        args:
          - name_or_flags:
              - source_file
            description: Path to the Python source file to parse.
          - name_or_flags:
              - -o
              - --output
            description: Path to output YAML/JSON file.
          - name_or_flags:
              - --output-format
            default: auto
            description: "Output format: yaml, json, console, or auto."
          - name_or_flags:
              - --include-tokens
            description: Include tokens in the output.

    semantic:
      event:
        group_key: semantic
        key: event
        name: Semantic Event Command
        description: Perform semantic analysis on a Tiferet event source file.
        args:
          - name_or_flags:
              - source_file
            description: Path to the Python source file to analyze.
          - name_or_flags:
              - -o
              - --output
            description: Path to output YAML/JSON file.
          - name_or_flags:
              - --output-format
            default: auto
            description: "Output format: yaml, json, console, or auto."
          - name_or_flags:
              - --include-tokens
            description: Include tokens in the output.
          - name_or_flags:
              - --include-ast
            description: Include the AST in the output.

    ir:
      event:
        group_key: ir
        key: event
        name: IR Event Command
        description: Generate a keter IR from a Tiferet event source file.
        args:
          - name_or_flags:
              - source_file
            description: Path to the Python source file to process.
          - name_or_flags:
              - -o
              - --output
            description: Path to output .keter file.
          - name_or_flags:
              - --output-format
            default: auto
            description: "Output format: keter or auto."

interfaces:
  compiler:
    name: Tiferet Dialect Compiler
    description: Lexical scanning and artifact extraction for Tiferet source files
    module_path: tiferet.contexts.app
    class_name: AppInterfaceContext
    const:
      container_config_file: config.yml
      feature_config_file: config.yml
      error_config_file: config.yml
      logging_config_file: config.yml
  compiler_cli:
    name: Compiler CLI
    description: Tiferet Dialect Compiler via CLI
    module_path: tiferet.contexts.cli
    class_name: CliContext
    attrs:
      cli_repo:
        module_path: tiferet.proxies.yaml.cli
        class_name: CliYamlProxy
        params:
          cli_config_file: config.yml
      cli_service:
        module_path: tiferet.handlers.cli
        class_name: CliHandler
    const:
      cli_config_file: config.yml
      container_config_file: config.yml
      feature_config_file: config.yml
      error_config_file: config.yml
      logging_config_file: config.yml
