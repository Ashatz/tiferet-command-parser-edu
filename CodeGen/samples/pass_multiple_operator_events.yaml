evt_grp:
  name: pass_multiple_operator_events
  desc: This module demonstrates how to define multiple operator events in the Tiferet
    Dialect, and how to parse them using the event parser
  impt:
    infra:
    - src: tiferet.events
      tgts:
      - DomainEvent
  evts:
    add:
      name: Add
      desc: An event that performs addition of two numbers.
      execute:
        params: &int_a_b_params
        - 'a:int:true::'
        - 'b:int:true::'
        returns: &int_returns
        - 'int:'
        snpt:
        - stmt:
          - Return(Add(a, b))
    subtract:
      name: Subtract
      desc: An event that performs subtraction of two numbers.
      execute:
        params: *int_a_b_params
        returns: *int_returns
        snpt:
        - stmt:
          - Return(Sub(a, b))
    multiply:
      name: Multiply
      desc: An event that performs multiplication of two numbers.
      execute:
        params: *int_a_b_params
        returns: *int_returns
        snpt:
        - stmt:
          - Return(Mul(a, b))
    divide:
      name: Divide
      desc: An event that performs division of two numbers.
      execute:
        params: *int_a_b_params
        returns: &float_returns
        - 'float:'
        snpt:
        - stmt:
          - Return(Div(a, b))
    modulus:
      name: Modulus
      desc: An event that performs modulus of two numbers.
      execute:
        params: *int_a_b_params
        returns: *int_returns
        snpt:
        - stmt:
          - Return(Mod(a, b))
    exponentiate:
      name: Exponentiate
      desc: An event that performs exponentiation of two numbers.
      execute:
        params: *int_a_b_params
        returns: *float_returns
        snpt:
        - stmt:
          - Return(Exp(a, b))
